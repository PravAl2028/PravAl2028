<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Language breakdown across 14 repositories: TypeScript 51.7 percent, HTML 23.3, Python 17.2, JavaScript 5.4, CSS 1.3, Rust 0.5, Vue 0.3">
  <title>Language breakdown across 14 repositories</title>

  <style>
    .win   { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .chrome{ fill: #161b22; }
    .mono  { font-family: 'SFMono-Regular', ui-monospace, 'DejaVu Sans Mono', Consolas, monospace; }
    .ttl   { fill: #7d8590; font-size: 12px; }
    .lbl   { fill: #c9d1d9; font-size: 13px; }
    .pct   { fill: #7d8590; font-size: 12px; }
    .note  { fill: #6e7681; font-size: 11px; }
    .track { fill: #21262d; rx: 4; }
    .bar   { rx: 4; transform-box: fill-box; transform-origin: left center;
             transform: scaleX(0); animation: grow .9s cubic-bezier(.22,.61,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .4s ease forwards; }

    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }

    .cursor { fill: #2ee6d6; animation: blink 1.1s step-end infinite; }

    /* Staggered so the bars cascade rather than all firing at once. */
    .d0 { animation-delay: .15s } .d1 { animation-delay: .27s } .d2 { animation-delay: .39s }
    .d3 { animation-delay: .51s } .d4 { animation-delay: .63s } .d5 { animation-delay: .75s }
    .d6 { animation-delay: .87s } .d7 { animation-delay: 1.05s }

    @media (prefers-reduced-motion: reduce) {
      .bar  { animation: none; transform: scaleX(1); }
      .fade { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <rect class="win" x=".5" y=".5" width="859" height="329" rx="10"/>
  <path class="chrome" d="M.5 10.5a10 10 0 0 1 10-10h839a10 10 0 0 1 10 10V40H.5z"/>
  <line x1="0" y1="40" x2="860" y2="40" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="58" cy="20" r="5" fill="#28c840"/>
  <text class="mono ttl" x="80" y="25">anachi@github — $ cat ./languages</text>
  <text class="mono note" x="700" y="25">5,265,396 bytes</text>

  <!-- TypeScript 51.7 -->
  <text class="mono lbl fade d0" x="24" y="79">TypeScript</text>
  <rect class="track" x="140" y="68" width="620" height="14"/>
  <rect class="bar d0" x="140" y="68" width="320" height="14" fill="#3178c6"/>
  <text class="mono pct fade d0" x="775" y="79">51.7%</text>

  <!-- HTML 23.3 -->
  <text class="mono lbl fade d1" x="24" y="114">HTML</text>
  <rect class="track" x="140" y="103" width="620" height="14"/>
  <rect class="bar d1" x="140" y="103" width="144" height="14" fill="#e34c26"/>
  <text class="mono pct fade d1" x="775" y="114">23.3%</text>

  <!-- Python 17.2 -->
  <text class="mono lbl fade d2" x="24" y="149">Python</text>
  <rect class="track" x="140" y="138" width="620" height="14"/>
  <rect class="bar d2" x="140" y="138" width="107" height="14" fill="#3572a5"/>
  <text class="mono pct fade d2" x="775" y="149">17.2%</text>

  <!-- JavaScript 5.4 -->
  <text class="mono lbl fade d3" x="24" y="184">JavaScript</text>
  <rect class="track" x="140" y="173" width="620" height="14"/>
  <rect class="bar d3" x="140" y="173" width="33" height="14" fill="#f1e05a"/>
  <text class="mono pct fade d3" x="775" y="184">5.4%</text>

  <!-- CSS 1.3 -->
  <text class="mono lbl fade d4" x="24" y="219">CSS</text>
  <rect class="track" x="140" y="208" width="620" height="14"/>
  <rect class="bar d4" x="140" y="208" width="9" height="14" fill="#563d7c"/>
  <text class="mono pct fade d4" x="775" y="219">1.3%</text>

  <!-- Rust 0.5 -->
  <text class="mono lbl fade d5" x="24" y="254">Rust</text>
  <rect class="track" x="140" y="243" width="620" height="14"/>
  <rect class="bar d5" x="140" y="243" width="5" height="14" fill="#dea584"/>
  <text class="mono pct fade d5" x="775" y="254">0.5%</text>

  <!-- Vue 0.3 -->
  <text class="mono lbl fade d6" x="24" y="289">Vue</text>
  <rect class="track" x="140" y="278" width="620" height="14"/>
  <rect class="bar d6" x="140" y="278" width="4" height="14" fill="#41b883"/>
  <text class="mono pct fade d6" x="775" y="289">0.3%</text>

  <text class="mono note fade d7" x="24" y="315">HTML is inflated by generated demo pages and templates — the hand-written surface is TypeScript and Python.</text>
  <rect class="cursor" x="820" y="305" width="8" height="13"/>
</svg>
