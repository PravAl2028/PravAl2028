name: activity feed

# Rewrites the `$ tail -f ./activity` block in README.md from the public events API.
# The logic lives in .github/scripts/activity.js so you can run it locally:
#
#     node .github/scripts/activity.js
#
# It writes nothing when the block is already current, so no empty commits accumulate.

on:
  schedule:
    - cron: "0 */6 * * *" # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/activity.js"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: activity-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: rebuild the activity block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: PravAl2028
        run: node .github/scripts/activity.js

      - name: commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh activity feed"
          git push
