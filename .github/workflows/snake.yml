name: contribution snake

# Renders the contribution graph as an animated snake and pushes the SVGs to a
# dedicated `output` branch. The README points at that branch via raw.githubusercontent,
# so the image updates without ever touching `main`.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily
  workflow_dispatch: # lets you run it by hand the first time
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: PravAl2028
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6a3,#77ab59,#61a34b,#3f8428

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
